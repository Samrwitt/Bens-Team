name: workroom
services:
  app:
    build: .
    image: workroom-manager:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WORKROOM_PORT:-8088}:8000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:?Set MANAGER_PASSWORD in .env first}
    volumes:
      - workroom_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  workroom_data:
